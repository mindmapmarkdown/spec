# Enforces the one invariant that keeps the specification and its test suite
# from drifting apart: examples/examples.json is generated from the examples in
# spec.md, and a pull request in which the two disagree fails.
#
# That is the whole point of the arrangement. A conformance suite maintained by
# hand alongside a specification will eventually contradict it, and the
# machine-readable copy wins by accident because that is the one implementers
# run. Generating the suite makes the contradiction impossible to commit.
#
# The unit tests run first, and on more than one Node version. The extractor is
# currently unexercised by the real source — spec.md has no examples yet — so
# the fixtures are the only evidence it works, and they earned their place
# immediately: the first run found a genuine bug, and a later one found that
# `node --test` takes different arguments on Node 20 and Node 24.

name: spec

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: tools (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor CONTRIBUTING.md §2 promises; 24 is current. Both are
        # tested because the test runner's own interface has changed between
        # them, and a contributor on either should not meet a failure the
        # maintainer cannot reproduce.
        node: ['20', '24']

    steps:
      - uses: actions/checkout@v4
        with:
          # The last-updated check below compares spec.md against the base
          # branch, so it needs history. The repository is small enough that
          # fetching all of it costs nothing worth measuring.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: node --test tools/*.test.mjs

      - name: examples.json matches spec.md
        run: node tools/extract-examples.mjs --check

      # The header said 2026-07-27 for three months — the date the file was
      # created — surviving seven commits to spec.md because nothing looked at
      # it. A date nobody checks does not say "unknown"; it says something false
      # with the authority of the document's own header. Same bargain as the
      # line above: a change to spec.md that leaves its date behind cannot
      # merge. The check never reads the clock, so it cannot fail on the
      # authoring timezone.
      - name: spec.md says when it was last updated
        env:
          BASE: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE" ]; then
            node tools/check-last-updated.mjs --base "origin/$BASE"
          else
            node tools/check-last-updated.mjs
          fi

      # §1.2.2 says a paragraph-level *(Informative)* marking covers that
      # paragraph alone, and the document did not obey it: sixteen markings
      # carried 42 further blocks of explanation into the normative surface
      # (RFC 0093). Fixing the text once is not enough — the next paragraph of
      # rationale would be written under a marking that cannot reach it. This is
      # the check that stops it, and it reports a candidate rather than ruling:
      # the two cases cannot be told apart by formatting, so a finding is a
      # question for a human. It covers the blocks a marking carries, which is
      # not every informative block in the document — RFC 0093's decision
      # measures the set it does not reach and says why.
      - name: Every *(Informative)* marking reaches its own run
        run: node tools/check-informative.mjs

  links:
    name: links
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Runs once rather than per Node version: the result depends on the
      # contents of the repository, not on the runtime. It runs on Linux, which
      # is the point — a link written `Spec.md` resolves on the maintainer's
      # Windows checkout and breaks here and on github.com.
      - name: Relative links and anchors
        run: node tools/check-links.mjs
